[project]
name = "relay-cookbook-elevenlabs-agents-call"
version = "1.0.0"
description = "Put an ElevenLabs Agent on a Relay Call through the ElevenLabs Agents WebSocket API."
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[elevenlabs]>=1.12,<2",
  "relaymessenger-pipecat>=0.1.0",
  "websockets>=15",
  "aiohttp>=3.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false

