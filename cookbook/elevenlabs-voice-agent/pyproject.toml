[project]
name = "relay-cookbook-elevenlabs-voice-agent"
version = "1.0.0"
description = "Answer a Relay Call with Grok (xAI) and an ElevenLabs voice, on Pipecat."
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[elevenlabs,openai,silero]>=1.12,<2",
  "relaymessenger-pipecat>=0.1.0",
  "websockets>=15",
  "aiohttp>=3.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false

