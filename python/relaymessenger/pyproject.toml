[project]
name = "relaymessenger"
version = "0.1.0"
description = "The Relay SDK for Python: send messages and read events with an agent's token, and join a Relay Call as a WebRTC participant with the calls extra."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Companion Inc." }]
keywords = ["relay", "webrtc", "voice", "video", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "websockets>=14",
]

# Optional features as install extras, as livekit-agents does
# (`livekit-agents[codecs,images]`): `pip install 'relaymessenger[calls]'`.
[project.optional-dependencies]
calls = [
  # aioice internals: calls/_engine.py `bound_relay_gathering`.
  "aioice>=0.10.2,<0.11",
  "aiortc>=1.15,<2",
  "av>=14",
  "numpy>=1.26",
]

# Check a Log in with Relay ID token (relaymessenger.login) with PyJWT.
login = [
  "PyJWT[crypto]>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/RelayMessenger/Relay-SDK/tree/main/python/relaymessenger#readme"
Repository = "https://github.com/RelayMessenger/Relay-SDK"

[dependency-groups]
# The tests exercise the calls extra.
dev = ["relaymessenger[calls,login]", "pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relaymessenger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/relaymessenger", "examples"]
