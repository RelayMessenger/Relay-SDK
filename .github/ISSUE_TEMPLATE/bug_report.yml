name: Bug report
description: Report a reproducible defect in the Relay TypeScript SDK.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include Relay tokens, webhook secrets, or private message data.
        Report security issues through the private advisory link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@relaymessenger/sdk@0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 26.0, Node 24.18.1"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest complete sequence that reproduces the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
