name: Release relay-claude-channel to npm

on:
  push:
    tags:
      - "claude-channel-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate, publish, and verify relay-claude-channel
    # npm OIDC trusted publishing accepts GitHub-hosted runners only.
    # Validation stays on Blacksmith in CI; publication must run here.
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Refuse a mismatched version or tag
        run: node scripts/claude-channel-release.mjs check-tag "$RELEASE_TAG"
      - name: Resolve and require a reviewed source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$tag_sha" = "$source_sha"
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf 'reviewed source: %s\n' "$source_sha"
      - name: Resolve the registry verification helper
        id: registry-verifier
        shell: bash
        run: |
          set -euo pipefail
          helper="scripts/verify-npm-registry-integrity.mjs"
          if [[ ! -f "$helper" ]]; then
            helper="$RUNNER_TEMP/verify-npm-registry-integrity.mjs"
            git show origin/main:scripts/verify-npm-registry-integrity.mjs > "$helper"
            printf 'using the reviewed-main verifier for a tag created before it existed\n'
          fi
          node --check "$helper"
          printf 'path=%s\n' "$helper" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm audit --workspace relay-claude-channel --omit=dev --audit-level=high
      - run: npm run check --workspace relay-claude-channel
      - run: npm test --workspace relay-claude-channel
      - run: npm run build --workspace relay-claude-channel
      - name: Pack and retain the exact release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-tmp
          mkdir -p .release-tmp
          npm pack --workspace relay-claude-channel --pack-destination .release-tmp
          mapfile -t tarballs < <(find .release-tmp -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          integrity="$(
            node -e "
              const { createHash } = require('node:crypto');
              const { readFileSync } = require('node:fs');
              const digest = createHash('sha512')
                .update(readFileSync(process.argv[1]))
                .digest('base64');
              process.stdout.write('sha512-' + digest);
            " "$tarball"
          )"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          SOURCE_SHA="${{ steps.source.outputs.sha }}" \
          TARBALL="$tarball" \
          SHA256="$sha256" \
          INTEGRITY="$integrity" \
          node <<'NODE'
          const { statSync, writeFileSync } = require("node:fs");
          const { basename } = require("node:path");
          const pkg = require("./integrations/claude-code/package.json");
          const manifest = {
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            sourceSha: process.env.SOURCE_SHA,
            tag: process.env.RELEASE_TAG,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            package: pkg.name,
            version: pkg.version,
            artifact: basename(process.env.TARBALL),
            size: statSync(process.env.TARBALL).size,
            sha256: process.env.SHA256,
            integrity: process.env.INTEGRITY,
          };
          writeFileSync(
            ".release-tmp/release-manifest.json",
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE
          {
            echo "tarball=$tarball"
            echo "manifest=.release-tmp/release-manifest.json"
            echo "integrity=$integrity"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          printf 'retained artifact: %s\nsha256: %s\nintegrity: %s\n' "$tarball" "$sha256" "$integrity"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-channel-${{ steps.source.outputs.sha }}
          path: |
            ${{ steps.artifact.outputs.tarball }}
            ${{ steps.artifact.outputs.manifest }}
          if-no-files-found: error
          retention-days: 90
      - name: Reconcile the version with npm before any publish retry
        id: registry
        run: node scripts/claude-channel-release.mjs registry-state
      # npm 12 blocks unapproved dependency install scripts during `npm ci`.
      # Keep the setup-node npm for the locked install, then upgrade only for
      # OIDC trusted publishing after every artifact check passes.
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@12.0.1
      - name: Clear the placeholder auth line that suppresses the OIDC exchange
        if: ${{ steps.registry.outputs.published != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          test -f "$npmrc"
          # setup-node's registry-url always writes `_authToken=${NODE_AUTH_TOKEN}`.
          # Releases here carry no token, so npm reads that empty value as
          # configured credentials, never requests an OIDC token, and PUTs
          # anonymously - which the registry answers with a bare E404.
          grep -v ':_authToken=' "$npmrc" > "$npmrc.oidc" || true
          mv "$npmrc.oidc" "$npmrc"
          ! grep -q ':_authToken=' "$npmrc"
          # Fail loudly here when the OIDC permission is missing, rather than as
          # an anonymous publish rejected several steps later.
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
      - name: Name the missing trusted-publisher record before npm obscures it
        if: ${{ steps.registry.outputs.published != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./.release-tmp/release-manifest.json').package")"
          # npm answers an unconfigured package with ENEEDAUTH, which reads as a
          # missing token rather than a missing trust record. Ask the exchange
          # directly so the failure names what to configure and where.
          if ! id_token="$(
            curl --silent --fail --show-error \
              --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).value))"
          )"; then
            printf 'could not mint an OIDC token to probe with; leaving the verdict to npm publish\n'
            exit 0
          fi
          body="$RUNNER_TEMP/oidc-exchange.json"
          if ! status="$(
            curl --silent --output "$body" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $id_token" \
              --header "Content-Type: application/json" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg//\//%2f}"
          )"; then
            printf 'trusted-publisher probe could not reach the registry; leaving the verdict to npm publish\n'
            exit 0
          fi
          # A 200 body carries a live publish token; never log or keep it.
          rm -f "$body"
          if [[ "$status" == "404" ]]; then
            workflow_ref="${GITHUB_WORKFLOW_REF%%@*}"
            {
              printf 'npm has no trusted-publisher record matching this workflow for %s.\n' "$pkg"
              printf 'Publishing would fail with ENEEDAUTH, which names credentials rather than trust.\n'
              printf 'Configure it at npmjs.com -> %s -> Settings -> Trusted publishing:\n' "$pkg"
              printf '  organization or user: %s\n' "${GITHUB_REPOSITORY%%/*}"
              printf '  repository:           %s\n' "${GITHUB_REPOSITORY##*/}"
              printf '  workflow filename:    %s\n' "${workflow_ref##*/}"
            } >&2
            exit 1
          fi
          printf 'trusted-publisher probe returned HTTP %s; continuing to publish\n' "$status"
      - name: Publish through npm trusted publishing
        if: ${{ steps.registry.outputs.published != 'true' }}
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --access public
      - name: Verify the published artifact integrity
        env:
          EXPECTED_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        run: >-
          node "${{ steps.registry-verifier.outputs.path }}"
          integrations/claude-code/package.json
          "$EXPECTED_INTEGRITY"
      - name: Verify the registry-installed artifact
        run: node scripts/claude-channel-release.mjs verify-registry
