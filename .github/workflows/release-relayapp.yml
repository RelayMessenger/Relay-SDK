name: Release relayapp to npm

on:
  push:
    tags:
      - "relayapp-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing relayapp-vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate, publish, and verify relayapp
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Refuse a mismatched version or tag
        run: node scripts/relayapp-release.mjs check-tag "$RELEASE_TAG"
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:claude-plugin
      - run: npm run gateway:harness
      - run: npm run pack:check
      - name: Reconcile the version with npm before any publish retry
        id: registry
        run: node scripts/relayapp-release.mjs registry-state
      - name: Refuse a missing publish credential
        if: ${{ steps.registry.outputs.published != 'true' }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; refusing to publish." >&2
            exit 1
          fi
      - name: Publish relayapp with npm provenance
        if: ${{ steps.registry.outputs.published != 'true' && github.event.repository.visibility == 'public' }}
        run: npm publish --workspace relayapp --access public --provenance
      - name: Publish relayapp without provenance for a private source repository
        if: ${{ steps.registry.outputs.published != 'true' && github.event.repository.visibility != 'public' }}
        run: npm publish --workspace relayapp --access public
      - name: Verify the registry-installed artifact
        run: node scripts/verify-relayapp-registry.mjs
