name: Release relaymessenger to npm

on:
  push:
    tags:
      - "relaymessenger-v*"

# A re-pushed tag must never race a run that is already publishing, and a
# publish in flight must never be cancelled: reconcile, then queue.
concurrency:
  group: release-relaymessenger-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/release-npm-package.yml
    with:
      package_label: relaymessenger
      workspace: "@relaymessenger/cli"
      manifest_path: packages/relaymessenger/package.json
      release_script: scripts/relaymessenger-release.mjs
      artifact_prefix: relaymessenger
      checks_profile: root
      verify_registry_script: scripts/verify-relaymessenger-registry.mjs
    permissions:
      contents: read
      id-token: write
