name: Publish package staging

# The staging release, automatic end to end (owner ruling, 2026-09-07:
# releases are automatic, nothing manual, ever). On every push to staging:
#
#   bump      scripts/staging-bump.mjs decides, for each package in catalog
#             order, whether its packed content differs from what npm holds and
#             which X.Y.Z-staging.N comes next; rewrites versions, pins, and
#             contract locks; commits the result as github-actions[bot] and
#             hands the commit to the later jobs as a git bundle. It does not
#             push: staging must never name a Relay dependency npm lacks.
#   sdk ... pi
#             staging-package.yml once per changed package that another
#             package pins (and the packages the catalog orders between
#             them), each after its Relay dependency has published, from the
#             bump commit.
#   land      pushes the bump commit to staging, once every package another
#             package pins is on npm. A push made with GITHUB_TOKEN starts no
#             new workflow run (GitHub: "events triggered by the GITHUB_TOKEN
#             will not create a new workflow run"), which is why the rest of
#             the publish is this run and not a second one.
#   cli ... claude-code
#             staging-package.yml for the remaining changed packages, from
#             the landed commit.
#
# Why land waits (2026-09-23): the bump used to push first and publish after.
# Any push to staging in between (and the cancelled run it caused) left a tree
# whose OpenClaw lock named an SDK npm did not have yet, and CI on that push
# failed "locked SDK 0.3.6-staging.24 is absent from npm" (commit 5510901,
# run 35919370436). The production release already orders it this way:
# scripts/release-run.mjs rewrites a dependent's pins only after the
# dependency is on npm, and records the publish afterwards.
#
# A newer push to staging cancels a run in flight; the newer run re-derives
# everything from the tip. A cancelled run leaves nothing on staging: what it
# published before landing is a prerelease npm has and the tree never named,
# which the next bump skips (staging-bump.mjs, `isPublished`). A run cancelled
# after landing is harmless: the next run finds an unpublished prerelease and
# publishes it as named.
#
# The main release (release.yml) then derives the plain X.Y.Z from these
# manifests and publishes as latest whatever npm lacks.

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: relay-staging-release
  cancel-in-progress: true

jobs:
  bump:
    if: >-
      github.repository == 'RelayMessenger/Relay-SDK' &&
      github.ref == 'refs/heads/staging'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    outputs:
      base: ${{ steps.commit.outputs.base }}
      sha: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false
      - name: Verify this run starts from staging's tip
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          git fetch origin staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
          git merge-base --is-ancestor "$EVENT_SHA" HEAD
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      - run: node --test scripts/staging-bump.test.mjs
      - id: plan
        name: Decide and write the next staging versions
        run: node scripts/staging-bump.mjs --write
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-bump-${{ github.sha }}
          path: .release-tmp/staging-bump/plan.json
          if-no-files-found: error
          retention-days: 30
      - id: commit
        name: Commit the bump
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "nothing to bump"
            exit 0
          fi
          git status --porcelain
          # Only what a bump may write: manifests, pins, locks, plugin
          # manifests, current import metadata, the lockfile, and claude-code's
          # generated runtime that embeds the version. Anything else means a build wrote where it
          # must not, and the run stops here.
          if git status --porcelain | awk '{print $2}' | grep -Ev \
            '^(\.claude-plugin/marketplace\.json|sources\.import-manifest\.json|package-lock\.json|packages/[a-z-]+/(package\.json|contracts/relay-v1\.lock\.json|plugin/contracts/relay-v1\.lock\.json|\.claude-plugin/(plugin|marketplace)\.json|plugin/\.claude-plugin/plugin\.json|runtime/server\.mjs|plugin/runtime/server\.mjs))$'
          then
            echo "unexpected paths changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json packages .claude-plugin/marketplace.json sources.import-manifest.json
          git commit -F - <<'EOF'
          release: version the changed staging packages automatically

          scripts/staging-bump.mjs compared each package's packed files with
          the tarball npm holds and moved the version of every package whose
          content changed, pinning dependents to the versions decided here.
          The plan is the staging-bump artifact of this run.
          EOF
          # The commit reaches staging only in the land job, after every
          # package another package pins is on npm; until then the later jobs
          # read it from this bundle, which carries it on top of BASE.
          mkdir -p "$RUNNER_TEMP/staging-bump-commit"
          git bundle create "$RUNNER_TEMP/staging-bump-commit/staging-bump.bundle" "${BASE}..HEAD"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --format='%H %s'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.commit.outputs.sha != steps.commit.outputs.base
        with:
          name: staging-bump-commit-${{ github.sha }}
          path: ${{ runner.temp }}/staging-bump-commit/staging-bump.bundle
          if-no-files-found: error
          retention-days: 30

  sdk:
    needs: bump
    if: ${{ !cancelled() && needs.bump.result == 'success' && contains(needs.bump.outputs.changed, ',sdk,') }}
    uses: ./.github/workflows/staging-package.yml
    with:
      package: sdk
      sha: ${{ needs.bump.outputs.sha }}
      base: ${{ needs.bump.outputs.base }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

  livekit:
    needs: [bump, sdk]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.sdk.result != 'failure' && contains(needs.bump.outputs.changed, ',livekit,') }}
    uses: ./.github/workflows/staging-package.yml
    with:
      package: livekit
      sha: ${{ needs.bump.outputs.sha }}
      base: ${{ needs.bump.outputs.base }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

  chat-sdk-adapter:
    needs: [bump, sdk, livekit]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.sdk.result != 'failure' && needs.livekit.result != 'failure' && contains(needs.bump.outputs.changed, ',chat-sdk-adapter,') }}
    uses: ./.github/workflows/staging-package.yml
    with:
      package: chat-sdk-adapter
      sha: ${{ needs.bump.outputs.sha }}
      base: ${{ needs.bump.outputs.base }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

  pi:
    needs: [bump, sdk, chat-sdk-adapter]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.sdk.result != 'failure' && needs.chat-sdk-adapter.result != 'failure' && contains(needs.bump.outputs.changed, ',pi,') }}
    uses: ./.github/workflows/staging-package.yml
    with:
      package: pi
      sha: ${{ needs.bump.outputs.sha }}
      base: ${{ needs.bump.outputs.base }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

  # Staging may name a Relay dependency only once npm has it: sdk and pi are
  # the packages another package pins (scripts/validate-workflows.mjs derives
  # that set from the manifests and holds this job to it). A changed one must
  # have published; an unchanged one is already on npm.
  land:
    needs: [bump, sdk, pi]
    if: ${{ !cancelled() && needs.bump.result == 'success' && (needs.sdk.result == 'success' || (needs.sdk.result == 'skipped' && !contains(needs.bump.outputs.changed, ',sdk,'))) && (needs.pi.result == 'success' || (needs.pi.result == 'skipped' && !contains(needs.bump.outputs.changed, ',pi,'))) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.bump.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.bump.outputs.sha != needs.bump.outputs.base
        with:
          name: staging-bump-commit-${{ github.sha }}
          path: ${{ runner.temp }}/staging-bump-commit
      - name: Push the bump commit to staging
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_BASE: ${{ needs.bump.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_SHA" = "$RELEASE_BASE" ]; then
            echo "nothing to land"
            exit 0
          fi
          git fetch --no-tags "$RUNNER_TEMP/staging-bump-commit/staging-bump.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_SHA}^")" = "$RELEASE_BASE"
          # A plain push: GitHub takes it only while staging is still
          # RELEASE_BASE. A newer push has already cancelled this run.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${RELEASE_SHA}:refs/heads/staging"
          git log -1 --format='%H %s' "$RELEASE_SHA"

  cli:
    needs: [bump, sdk, pi, land]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.land.result == 'success' && needs.sdk.result != 'failure' && needs.pi.result != 'failure' && contains(needs.bump.outputs.changed, ',cli,') }}
    uses: ./.github/workflows/staging-package.yml
    with:
      package: cli
      sha: ${{ needs.bump.outputs.sha }}
      base: ${{ needs.bump.outputs.base }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

  openclaw:
    needs: [bump, sdk, cli, land]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.land.result == 'success' && needs.sdk.result != 'failure' && needs.cli.result != 'failure' && contains(needs.bump.outputs.changed, ',openclaw,') }}
    uses: ./.github/workflows/staging-package.yml
    with:
      package: openclaw
      sha: ${{ needs.bump.outputs.sha }}
      base: ${{ needs.bump.outputs.base }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

  claude-code:
    needs: [bump, sdk, openclaw, land]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.land.result == 'success' && needs.sdk.result != 'failure' && needs.openclaw.result != 'failure' && contains(needs.bump.outputs.changed, ',claude-code,') }}
    uses: ./.github/workflows/staging-package.yml
    with:
      package: claude-code
      sha: ${{ needs.bump.outputs.sha }}
      base: ${{ needs.bump.outputs.base }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
