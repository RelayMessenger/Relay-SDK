# Alarms when the published CLI bundles an OpenClaw plugin that is not the one
# npm serves as latest. See scripts/check-bundled-plugin-currency.mjs for why
# this is a registry read rather than a repository check.
#
# It is deliberately NOT a pull-request gate. The state it measures is release
# debt, not a property of any branch: it becomes true the moment a plugin
# release lands without a CLI release, with no commit involved, and it stays
# true until someone cuts one. Gating PRs on it would block unrelated work on a
# condition no PR author caused or can fix. It is also why the schedule exists
# at all — a push-only trigger cannot notice a drift that opens on a quiet day.
name: Bundled plugin currency

on:
  push:
    branches: [main]
  schedule:
    # Off the hour on purpose; nothing here needs to race the rest of the fleet.
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundled-plugin-currency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  currency:
    name: Published CLI bundles the published plugin
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The check has no dependencies of its own; it reads the registry and the
      # published tarball, so it deliberately skips `npm ci`.
      - run: node scripts/check-bundled-plugin-currency.mjs
