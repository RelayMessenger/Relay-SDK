name: Release @relaymessenger/sdk to npm

on:
  push:
    tags:
      - "sdk-v*"

# A re-pushed tag must never race a run that is already publishing, and a
# publish in flight must never be cancelled: reconcile, then queue.
concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/release-npm-package.yml
    with:
      package_label: "@relaymessenger/sdk"
      workspace: "@relaymessenger/sdk"
      manifest_path: packages/sdk/package.json
      release_script: scripts/sdk-release.mjs
      artifact_prefix: sdk
      checks_profile: workspace
      verify_registry_script: scripts/sdk-release.mjs
      verify_registry_arg: verify-registry
    permissions:
      contents: read
      id-token: write
