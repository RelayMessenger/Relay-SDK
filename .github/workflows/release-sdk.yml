name: Release @relaymessenger/sdk to npm

# One of six release workflows, one per package this repository publishes.
# Everything package-specific lives in scripts/release-packages.mjs, so these
# files differ only in their name, tag series, RELEASE_KEY, and artifact slug;
# scripts/validate-workflows.mjs fails CI if any of the four drift from the
# catalog or if a catalogued package loses its workflow.
#
# Two ways in, and only one of them can publish:
#   push of a sdk-v* tag  -> validate, pack, dry run, then publish
#   workflow_dispatch (dry_run)   -> validate, pack, dry run, then stop
#
# Runners are Blacksmith, never GitHub-hosted (owner ruling, 2026-09-07). That
# rules out npm OIDC trusted publishing, which npm supports on cloud-hosted
# runners only, and npm attestation, which Sigstore rejects on any other runner
# with E422 "Unsupported GitHub Actions runner". So this workflow authenticates
# with the npm-release environment's NPM_PUBLISH_TOKEN and asks for no
# attestation, explicitly: five packages still declare "provenance": true in
# publishConfig, and only a CLI flag outranks publishConfig.

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate, pack, and run `npm publish --dry-run`, then stop.
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: relay-release-sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_KEY: sdk
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  package:
    name: Validate, pack, and dry-run @relaymessenger/sdk
    if: github.repository == 'RelayMessenger/Relay-SDK'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      manifest: ${{ steps.resolve.outputs.manifest }}
      workspace: ${{ steps.resolve.outputs.workspace }}
      version: ${{ steps.resolve.outputs.version }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Refuse a manual run that is not a dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "A manual run of this workflow only ever dry-runs." >&2
          echo "Publishing @relaymessenger/sdk happens by pushing a sdk-v* tag." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - name: Resolve the release catalog entry
        id: resolve
        run: node scripts/release-package.mjs resolve --package "$RELEASE_KEY"
      - name: Read the source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse a mismatched version or tag
        if: github.event_name == 'push'
        run: node scripts/release-package.mjs check-tag --package "$RELEASE_KEY" --tag "$RELEASE_TAG"
      - name: Require a reviewed source commit
        if: github.event_name == 'push'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          printf 'reviewed source: %s\n' "$SOURCE_SHA"
      - run: npm ci
      - run: npm audit --workspace '${{ steps.resolve.outputs.workspace }}' --omit=dev --audit-level=high
      # Every other workspace type-checks and packs against the built SDK.
      - name: Build the canonical SDK workspace
        run: npm run build --workspace @relaymessenger/sdk
      - name: Validate the release workspace
        run: npm run '${{ steps.resolve.outputs.validate }}'
      - name: Verify validation kept the tracked tree clean
        run: test -z "$(git status --porcelain)"
      - name: Pack and retain the exact release artifact
        id: artifact
        run: node scripts/release-package.mjs pack --package "$RELEASE_KEY" --destination .release-tmp
      - name: Verify packing kept the tracked tree clean
        run: test -z "$(git status --porcelain)"
      # The last gate before the registry, and the only gate a manual run
      # reaches. `--no-provenance` is load-bearing here too, so a dry run
      # exercises the same publish arguments the real publish uses.
      - name: Dry-run the publish
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access public
          --no-provenance
          --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-${{ steps.source.outputs.sha }}
          path: |
            ${{ steps.artifact.outputs.tarball }}
            ${{ steps.artifact.outputs.manifest }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish and verify @relaymessenger/sdk
    needs: package
    # A manual run stops at the dry run above. Only a pushed tag reaches npm.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sdk-${{ needs.package.outputs.sha }}
          path: .release-tmp
      # npm@12 is the first release whose publish accepts --no-provenance.
      # npm@12.0.2 supports node ^22.22.2 || ^24.15.0 || >=26.0.0; bumping this
      # pin requires re-checking .nvmrc against that range.
      - name: Install the publishing npm CLI
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Take the exact artifact the package job proved
        id: artifact
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find .release-tmp -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          test "$(sha256sum "$tarball" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Name the missing publish credential before npm obscures it
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            # npm answers a missing token with ENEEDAUTH several steps later,
            # which reads as an npm outage rather than a missing secret.
            echo "The npm-release environment has no NPM_PUBLISH_TOKEN secret." >&2
            echo "Add it at Settings -> Environments -> npm-release." >&2
            exit 1
          fi
          printf 'npm-release carries a publish credential\n'
      - name: Reconcile the version with npm before any publish retry
        id: registry
        run: node scripts/release-package.mjs registry-state --package "$RELEASE_KEY"
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access public
          --no-provenance
      - name: Verify the published artifact integrity
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
        run: >-
          node scripts/verify-npm-registry-integrity.mjs
          '${{ needs.package.outputs.manifest }}'
          "$EXPECTED_INTEGRITY"
      - name: Verify the registry-installed artifact
        run: node scripts/release-package.mjs verify-registry --package "$RELEASE_KEY"
