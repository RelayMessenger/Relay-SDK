name: Release to npm

# The one production release. Nothing is published by hand (owner ruling,
# 2026-09-07): the only deliberate act is merging staging into main. This
# workflow then reads the tree as staging wrote it, derives each package's
# plain version by stripping `-staging.N`, pins the Relay packages to each
# other at those versions, skips whatever npm already has, and publishes the
# rest in dependency order as `latest`. A `<prefix><version>` git tag records
# each publish afterwards; it is never the trigger.
#
# Two ways in, and only one of them can publish:
#   push to main                -> derive, validate, pack, publish, tag, verify
#   workflow_dispatch (dry_run) -> derive, pack, `npm publish --dry-run`, stop
#
# Runners are Blacksmith, never GitHub-hosted (owner ruling, 2026-09-07), so
# npm attestation and OIDC trusted publishing are unavailable; the job
# authenticates with the npm-release environment's NPM_PUBLISH_TOKEN and asks
# for no attestation, explicitly.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Derive, pack, and run `npm publish --dry-run`, then stop.
        type: boolean
        default: true
        required: true
      assume_published:
        description: Dry-run proof only. Comma-separated name@version to treat as already on npm.
        type: string
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: relay-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Derive, publish, and record
    if: github.repository == 'RelayMessenger/Relay-SDK'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 120
    environment: npm-release
    steps:
      - name: Refuse a manual run that is not a dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "A manual run of this workflow only ever dry-runs." >&2
          echo "Publishing happens when staging is merged into main." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.8
          enable-cache: false
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      - name: Prove the release derivation and order
        run: node --test scripts/release-derive.test.mjs
      - name: Build the canonical SDK workspace
        run: npm run build --workspace @relaymessenger/sdk
      # npm@12 is the first release whose publish accepts --no-provenance.
      # npm@12.0.2 supports node ^22.22.2 || ^24.15.0 || >=26.0.0; bumping this
      # pin requires re-checking .nvmrc against that range.
      - name: Install the publishing npm CLI
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Name the missing publish credential before npm obscures it
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "The npm-release environment has no NPM_PUBLISH_TOKEN secret." >&2
            echo "Add it at Settings -> Environments -> npm-release." >&2
            exit 1
          fi
          printf 'npm-release carries a publish credential\n'
      - name: Dry-run the release
        if: github.event_name == 'workflow_dispatch'
        env:
          # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}`
          # into the job npmrc, and npm aborts whenever that variable is
          # undefined; a dry run needs a value, not a credential.
          NODE_AUTH_TOKEN: dry-run
          RELAY_ASSUME_PUBLISHED: ${{ inputs.assume_published }}
        run: node scripts/release-run.mjs --dry-run
      - name: Publish, verify, and record
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: .release-tmp/release/
          if-no-files-found: ignore
          retention-days: 90
