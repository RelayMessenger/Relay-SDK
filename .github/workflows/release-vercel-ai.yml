name: Release @relaymessenger/vercel-ai to npm

on:
  push:
    tags:
      - "vercel-ai-v*"

# A re-pushed tag must never race a run that is already publishing, and a
# publish in flight must never be cancelled: reconcile, then queue.
concurrency:
  group: release-vercel-ai-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/release-npm-package.yml
    with:
      package_label: "@relaymessenger/vercel-ai"
      workspace: "@relaymessenger/vercel-ai"
      manifest_path: integrations/vercel-ai/package.json
      release_script: scripts/vercel-ai-release.mjs
      artifact_prefix: vercel-ai
      checks_profile: workspace
      verify_registry_script: scripts/vercel-ai-release.mjs
      verify_registry_arg: verify-registry
    permissions:
      contents: read
      id-token: write
