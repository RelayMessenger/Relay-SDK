name: Release @relaymessenger/vercel-ai to npm

on:
  push:
    tags:
      - "vercel-ai-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vercel-ai-vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate, publish, and verify @relaymessenger/vercel-ai
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - name: Refuse a mismatched version or tag
        run: node scripts/vercel-ai-release.mjs check-tag "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check --workspace @relaymessenger/vercel-ai
      - run: npm test --workspace @relaymessenger/vercel-ai
      - run: npm run build --workspace @relaymessenger/vercel-ai
      - name: Reconcile the version with npm before any publish retry
        id: registry
        run: node scripts/vercel-ai-release.mjs registry-state
      # npm 12 blocks unapproved dependency install scripts during `npm ci`.
      # Keep the setup-node npm for the locked install, then upgrade only for
      # OIDC trusted publishing after every artifact check passes.
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@12.0.1
      - name: Publish through npm trusted publishing
        if: ${{ steps.registry.outputs.published != 'true' }}
        run: npm publish --workspace @relaymessenger/vercel-ai --access public
      - name: Verify the registry-installed artifact
        run: node scripts/vercel-ai-release.mjs verify-registry
