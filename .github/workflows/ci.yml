name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, blacksmith-2vcpu-windows-2025]
        # Exercise every Node release line declared by the OpenClaw peer range.
        node: [22.22.3, 24.15.0, 25.9.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate

  minimum-node:
    name: ${{ matrix.name }} minimum Node ${{ matrix.node }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: relayapp CLI
            node: 22.18.0
            directory: .
            install: npm ci --workspace relayapp
            verify: npm run check --workspace relayapp && npm run build --workspace relayapp && npm test --workspace relayapp
          - name: Claude channel
            node: 20.11.0
            directory: integrations/claude-code
            install: npm ci
            verify: npm run verify
          - name: OpenClaw plugin
            node: 22.22.3
            directory: integrations/openclaw
            install: npm ci
            verify: npm run check && npm run build && npm test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: ${{ matrix.install }}
        working-directory: ${{ matrix.directory }}
      - run: ${{ matrix.verify }}
        working-directory: ${{ matrix.directory }}

  package-smoke:
    name: Clean package and installed-tarball smokes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run validate:claude-plugin
      - run: npm run gateway:harness
      - run: npm run pack:check

  macos-relayapp-runtime:
    name: macOS installed relayapp Claude/Codex runtime smoke
    # macOS runner minutes stay the most expensive in the fleet. Every PR
    # already gets the Linux validate/minimum-node/package-smoke jobs; this smoke
    # runs on merge to main and the tag-driven release workflow re-proves it,
    # so it does not need to re-run on every PR push too.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Packs, installs into a clean temp project, loads the CLI runtime and
      # resolves both pinned ACP adapter entrypoints from the installed tree.
      - run: node scripts/pack-smoke.mjs

  windows-relayapp-runtime:
    name: Windows installed relayapp integration smoke
    # Same merge-only reasoning as the macOS smoke job above.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      # Exercises installed-tarball Claude and OpenClaw installers through
      # Windows npm .cmd shims, plus both pinned ACP adapter entrypoints.
      - run: node scripts/pack-smoke.mjs
