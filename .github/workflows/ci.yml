name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Pushes to
# staging and main each get their own group (the run id), so none is ever
# cancelled or replaced while still pending: the staging and production
# releases run from those pushes. A shared group would cancel a pending push
# run even with cancel-in-progress off (GitHub's "queue: single" default).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No workflow path filter: required validate still reports a result for notes.
  # Missing outputs fail open below; unsafe diffs select the complete suite.
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
      node: ${{ steps.diff.outputs.node }}
      python-sdk: ${{ steps.diff.outputs.python-sdk }}
      python-pipecat: ${{ steps.diff.outputs.python-pipecat }}
      python-livekit: ${{ steps.diff.outputs.python-livekit }}
      cookbook-python: ${{ steps.diff.outputs.cookbook-python }}
      cookbook: ${{ steps.diff.outputs.cookbook }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-affected.mjs --github

  validate:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.node != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      # Full history: scripts/validate-contract.mjs reads the contract at the
      # commit the skill lock pins, which a shallow clone does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.8
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: ${{ github.job }}
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      # The full gate must still start if the selector cannot parse or import.
      - name: Validate the full workspace
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: npm run validate
      - name: Validate affected workspaces
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.full == 'false'
        env:
          EVENT: ${{ github.event_name }}
          FORCE_FULL: ${{ needs.changes.result != 'success' || needs.changes.outputs.full != 'false' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-affected.mjs --run
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures

  # relaymessenger, the Python SDK (its calls extra is the call core under the
  # LiveKit and Pipecat packages): types and unit tests on Linux from the
  # locked environment, then a wheel and sdist build. Nothing is published.
  python-sdk:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.python-sdk != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python/relaymessenger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.8
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked --python 3.12
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Check the dists as PyPI will render them
        run: uv run --isolated --no-project --python 3.12 --with twine==7.0.0 python -m twine check --strict dist/*

  # relaymessenger-pipecat, the Pipecat transport for Relay Calls: types and
  # unit tests on Linux from the locked environment, then a wheel and sdist
  # build. Nothing is published.
  python-pipecat:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.python-pipecat != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python/relaymessenger-pipecat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.8
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked --python 3.12
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Check the dists as PyPI will render them
        run: uv run --isolated --no-project --python 3.12 --with twine==7.0.0 python -m twine check --strict dist/*

  # relaymessenger-livekit, the Python twin of @relaymessenger/livekit: types
  # and unit tests on Linux from the locked environment, then a wheel and sdist
  # build. Nothing is published.
  python-livekit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.python-livekit != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python/relaymessenger-livekit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.8
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked --python 3.12
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Check the dists as PyPI will render them
        run: uv run --isolated --no-project --python 3.12 --with twine==7.0.0 python -m twine check --strict dist/*

  # Every cookbook folder must work when a developer copies it out of GitHub
  # and runs `npm install && npm start` with only an Agent Token. This job
  # never installs the workspace: each folder is copied outside the checkout,
  # installed from the real registry, and type-checked from its own
  # devDependencies (scripts/validate-cookbook-standalone.mjs). The branch
  # picks the npm channel: staging (a push to it, or a pull request into it)
  # installs the `staging` dist-tag's builds, every other branch the `latest`
  # releases. The workspace-side half of that proof, that the same folders
  # resolve the workspace sdk inside the monorepo, runs under
  # `npm run validate` above.
  cookbook-standalone:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.cookbook != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: node --test scripts/validate-cookbook-standalone.test.mjs
      - run: node scripts/validate-cookbook-standalone.mjs
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
      - name: Check affected standalone cookbooks
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.full == 'false'
        env:
          EVENT: ${{ github.event_name }}
          FORCE_FULL: ${{ needs.changes.result != 'success' || needs.changes.outputs.full != 'false' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/ci-affected.mjs --cookbooks > "$RUNNER_TEMP/cookbooks"
          while IFS= read -r source; do
            node scripts/validate-cookbook-standalone.mjs --only "${source#cookbook/}"
          done < "$RUNNER_TEMP/cookbooks"

  # The Python cookbook folders (the Pipecat voice agents) must work when a
  # developer copies one out of GitHub: each is copied outside the checkout,
  # installed from its own uv.lock, every script is imported, and its tests
  # run offline: each folder's conftest.py fails every connection off this
  # machine, so a test never reaches xAI, ElevenLabs or LiveKit Cloud even if
  # a key is set. The tests build each bot's services and Pipecat pipeline
  # with placeholder keys (nothing connects), check the greeting reaches the
  # model, and check the ElevenLabs Agents bridge against a fake socket. They
  # do not place a call; the live call is proven by hand on staging.
  cookbook-python:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.cookbook-python != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.8
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: ${{ github.job }}
      - name: List all Python cookbooks without the selector
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        run: |
          set -euo pipefail
          for project in cookbook/*/pyproject.toml; do
            dirname "$project"
          done > "$RUNNER_TEMP/python-cookbooks"
      - name: List affected Python cookbooks
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.full == 'false'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-affected.mjs --python-cookbooks > "$RUNNER_TEMP/python-cookbooks"
      - name: Copy, install, and import selected Python cookbooks
        run: |
          set -euo pipefail
          while IFS= read -r source; do
            copy="$(mktemp -d)"
            cp -R "$source/." "$copy/"
            (
              cd "$copy"
              uv sync --locked --python 3.12
              for script in *.py; do
                uv run --locked python -c "import ${script%.py}"
                echo "$source/$script imports"
              done
              uv run --locked pytest -q
            )
            rm -rf "$copy"
          done < "$RUNNER_TEMP/python-cookbooks"

  # The production release proves itself before it can run: the same
  # derivation, packing, and `npm publish --dry-run` that release.yml performs
  # on a push to main, here on full plans (including every protected push). GitHub only dispatches a
  # workflow that already exists on the default branch, so this is also the
  # only way a change to the release itself is rehearsed before it merges.
  release-dry-run:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.release != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      - run: node --test scripts/release-derive.test.mjs scripts/release-cookbook-land.test.mjs
      - run: npm run build --workspace @relaymessenger/sdk
      - run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Rehearse a skip for a package npm already has
        env:
          NODE_AUTH_TOKEN: dry-run
        run: |
          set -euo pipefail
          # The plan against the live registry, whatever it says today...
          node scripts/release-run.mjs --dry-run --plan-only | tee plan-a.txt
          grep -q '^release plan only: ' plan-a.txt
          # ...and the same plan told the derived sdk version is on npm must
          # say skip for sdk. (release-derive.test.mjs proves the flip itself
          # against a mocked registry; this proves the wiring in CI.)
          sdk_version="$(node -e 'import("./scripts/release-derive.mjs").then(m => console.log(m.deriveVersion(JSON.parse(require("fs").readFileSync("packages/sdk/package.json","utf8")).version)))')"
          RELAY_ASSUME_PUBLISHED="@relaymessenger/sdk@${sdk_version}" node scripts/release-run.mjs --dry-run --plan-only | tee plan-b.txt
          grep -q '^release plan only: sdk=skip ' plan-b.txt
      - name: Dry-run the release
        env:
          NODE_AUTH_TOKEN: dry-run
        run: node scripts/release-run.mjs --dry-run
  # The staging release proves itself the same way: the bump decisions
  # publish-package-staging.yml would write, derived here against the live
  # registry and written nowhere. Its decision table is unit-tested first.
  staging-bump-dry-run:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full != 'false' || needs.changes.outputs.release != 'false') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      - run: node --test scripts/staging-bump.test.mjs
      - name: Rehearse the staging bump
        run: node scripts/staging-bump.mjs --dry-run
      - name: Verify the rehearsal wrote nothing tracked
        run: test -z "$(git status --porcelain)"
