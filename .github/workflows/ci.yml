name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Pushes to
# staging and main each get their own group (the run id), so none is ever
# cancelled or replaced while still pending: the staging and production
# releases run from those pushes. A shared group would cancel a pending push
# run even with cancel-in-progress off (GitHub's "queue: single" default).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Picks the validate legs (scripts/ci-affected.mjs). Pushes, manual runs,
  # and pull requests into main run every leg; a pull request into staging
  # runs the legs whose workspace it touches plus their dependents. The
  # aggregate `validate` job below is the required check on main.
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
      release: ${{ steps.select.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-affected.mjs

  # One job per package harness, in parallel. Each leg installs the workspace,
  # builds the workspaces it imports, and runs its root validate:* script.
  validate-leg:
    name: validate (${{ matrix.leg }})
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      # Full history: packages/cli's contract check reads the contract at the
      # commit its lock pins, which a shallow clone does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      # The OpenClaw pack smoke and gateway harness install the plugin as a
      # user would. Its SDK pin names this tree's SDK version, which the
      # registry may already hold with older bytes. Point both at the SDK
      # packed from this commit; the release still validates the registry.
      - name: Pack this commit's SDK for the plugin install checks
        if: matrix.leg == 'openclaw'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-candidate"
          npm pack --workspace @relaymessenger/sdk --pack-destination "$RUNNER_TEMP/sdk-candidate"
          tarballs=("$RUNNER_TEMP"/sdk-candidate/*.tgz)
          test "${#tarballs[@]}" -eq 1
          echo "RELAY_OPENCLAW_SDK_CANDIDATE_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"
      - name: Build the workspaces this leg imports
        if: matrix.build != ''
        run: npm run build ${{ matrix.build }}
      - run: npm run ${{ matrix.run }}

  # The required check. It passes when every selected leg passed, or when no
  # leg was needed; it fails when the selector or any leg failed.
  validate:
    needs: [changes, validate-leg]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          LEGS: ${{ needs.validate-leg.result }}
        run: |
          echo "changes=$CHANGES legs=$LEGS"
          test "$CHANGES" = success
          case "$LEGS" in success|skipped) ;; *) exit 1 ;; esac

  # Every cookbook folder must work when a developer copies it out of GitHub
  # and runs `npm install && npm start` with only an Agent Token. This job
  # never installs the workspace: each folder is copied outside the checkout,
  # installed from the real registry, and type-checked from its own
  # devDependencies (scripts/validate-cookbook-standalone.mjs). The branch
  # picks the npm channel: staging (a push to it, or a pull request into it)
  # installs the `staging` dist-tag's builds, every other branch the `latest`
  # releases. The workspace-side half of that proof, that the same folders
  # resolve the workspace sdk inside the monorepo, runs in the cookbook leg
  # above. It checks the registry, not this change, so it runs on pushes, on
  # pull requests into main, and on pull requests that change root files.
  cookbook-standalone:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: node --test scripts/validate-cookbook-standalone.test.mjs
      - run: node scripts/validate-cookbook-standalone.mjs

  # The production release proves itself before it can run: the same
  # derivation, packing, and `npm publish --dry-run` that release.yml performs
  # on a push to main, here on pushes, on pull requests into main, and on
  # pull requests that change root files (the release scripts among them).
  # GitHub only dispatches a workflow that already exists on the default
  # branch, so this is the only way a change to the release is rehearsed
  # before it merges.
  release-dry-run:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      - run: node --test scripts/release-derive.test.mjs scripts/release-cookbook-land.test.mjs
      - run: npm run build --workspace @relaymessenger/sdk
      - run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Rehearse a skip for a package npm already has
        env:
          NODE_AUTH_TOKEN: dry-run
        run: |
          set -euo pipefail
          # The plan against the live registry, whatever it says today...
          node scripts/release-run.mjs --dry-run --plan-only | tee plan-a.txt
          grep -q '^release plan only: ' plan-a.txt
          # ...and the same plan told the derived sdk version is on npm must
          # say skip for sdk. (release-derive.test.mjs proves the flip itself
          # against a mocked registry; this proves the wiring in CI.)
          sdk_version="$(node -e 'import("./scripts/release-derive.mjs").then(m => console.log(m.deriveVersion(JSON.parse(require("fs").readFileSync("packages/sdk/package.json","utf8")).version)))')"
          RELAY_ASSUME_PUBLISHED="@relaymessenger/sdk@${sdk_version}" node scripts/release-run.mjs --dry-run --plan-only | tee plan-b.txt
          grep -q '^release plan only: sdk=skip ' plan-b.txt
      - name: Dry-run the release
        env:
          NODE_AUTH_TOKEN: dry-run
        run: node scripts/release-run.mjs --dry-run
